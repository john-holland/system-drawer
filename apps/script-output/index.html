<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Script Output</title>
  <link rel="stylesheet" href="/static/shared/continuum-nav/continuum-nav.css" />
  <link rel="stylesheet" href="/static/shared/continuum-lemma-entry/continuum-lemma-entry.css" />
  <link rel="stylesheet" href="/static/shared/continuum-script-editor/continuum-script-editor.css" />
  <link rel="stylesheet" href="/script-output.css" />
  <script src="/static/shared/vendor/ace.js"></script>
  <script src="/static/shared/continuum-user-session/continuum-user-session.js"></script>
  <script src="/static/shared/continuum-nav/continuum-nav.js"></script>
  <script src="/static/shared/continuum-script-editor/continuum-script-spans.js"></script>
  <script src="/static/shared/continuum-lemma-entry/continuum-lemma-entry.js"></script>
  <script src="/static/shared/continuum-script-output/continuum-script-permissions.js"></script>
  <script src="/static/shared/continuum-script-output/continuum-script-ack.js"></script>
  <script src="/static/shared/continuum-script-editor/continuum-script-editor.js"></script>
  <link rel="stylesheet" href="/static/shared/continuum-lemma-composition/continuum-lemma-composition-editor.css" />
  <link rel="stylesheet" href="/static/shared/continuum-lemma-composition/continuum-lemma-prompt-editor.css" />
  <script src="/static/shared/continuum-lemma-composition/continuum-lemma-picker.js"></script>
  <script src="/static/shared/continuum-lemma-composition/continuum-lemma-composition-editor.js"></script>
  <script src="/static/shared/continuum-lemma-composition/continuum-lemma-prompt-editor.js"></script>
  <script src="/static/shared/continuum-clause-selector/continuum-clause-selector.js"></script>
  <script src="/static/shared/continuum-script-output/continuum-script-output.js"></script>
</head>
<body class="continuum-script-output">
  <div id="continuum-nav-root"></div>
  <div class="so-toolbar-row">
    <label>Draft ID <input id="draft-id" type="text" placeholder="draft episode uuid" /></label>
    <label>Episode ID <input id="episode-id" type="text" placeholder="episode uuid" /></label>
    <button type="button" id="load-btn">Load</button>
    <button type="button" id="save-btn">Save</button>
    <button type="button" id="table-read-btn" hidden>Start table read</button>
    <button type="button" id="suggest-btn" hidden>Submit suggestion</button>
  </div>
  <div id="status"></div>
  <p id="mode-hint" class="so-mode-hint"></p>

  <header id="so-header" class="so-header"></header>

  <section id="so-suggestions-section" class="so-section" hidden>
    <h2>Script suggestions</h2>
    <div id="so-suggestions" class="so-panel"></div>
    <label style="display:block;margin-top:8px;font-size:13px">Note with suggestion (optional)
      <input id="suggest-comment" type="text" style="width:100%;box-sizing:border-box;margin-top:4px" placeholder="Comment for the author"/>
    </label>
  </section>

  <section class="so-section">
    <h2>Script</h2>
    <div id="editor-host"></div>
  </section>

  <section class="so-section">
    <h2>Lemma clauses at selection</h2>
    <div id="so-lemma-panel"></div>
  </section>

  <section id="so-diffs-section" class="so-section" hidden>
    <h2>Diffs — active suggestion</h2>
    <div id="so-diffs" class="so-panel"></div>
  </section>

  <section id="so-accept-section" class="so-section" hidden>
    <h2>Accept / deny suggestion</h2>
    <div id="so-accept-bar" class="so-panel so-accept-bar"></div>
    <div id="so-suggestion-comments" class="so-panel" style="margin-top:8px"></div>
  </section>

  <section class="so-section">
    <h2>Change list</h2>
    <div id="so-change-list" class="so-panel"></div>
  </section>

  <section class="so-section">
    <h2>Comments</h2>
    <div id="so-comments" class="so-panel"></div>
    <div id="so-comment-form" class="so-comment-form" style="margin-top:8px">
      <label>Add comment <textarea id="so-new-comment" rows="2"></textarea></label>
      <button type="button" id="so-add-comment-btn">Add comment</button>
    </div>
  </section>

  <details class="so-collapsed">
    <summary>Old comments</summary>
    <ul id="so-old-comments"></ul>
  </details>

  <details class="so-collapsed">
    <summary>Old suggestions</summary>
    <ul id="so-old-suggestions"></ul>
  </details>

  <script>
    ContinuumNav.mount({ app: 'hub', theme: 'light' });
    document.getElementById('so-add-comment-btn').onclick = () => {
      ContinuumScriptOutput.addComment();
    };
    ContinuumScriptOutput.init({
      apiBase: '/api',
      getUserId: () => ContinuumUserSession.getUserId(),
    });
    ContinuumUserSession.onChange(() => {
      if (ContinuumScriptOutput._state && ContinuumScriptOutput._state.activeId) ContinuumScriptOutput.loadDraft();
    });
    document.getElementById('table-read-btn').onclick = async () => {
      const draftId = document.getElementById('draft-id').value.trim();
      if (!draftId) return;
      const res = await fetch('/api/table-read/sessions', {
        method: 'POST',
        headers: ContinuumUserSession.getHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ draftEpisodeId: draftId }),
      });
      if (!res.ok) { alert('Could not start table read'); return; }
      const data = await res.json();
      window.open('/table-read?session=' + encodeURIComponent(data.id) + '&draft=' + encodeURIComponent(draftId), '_blank');
    };
  </script>
</body>
</html>
