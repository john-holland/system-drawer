<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Continuum Script Editor Host</title>
  <link rel="stylesheet" href="continuum-script-editor.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f5f5f5; }
    #toolbar { padding: 8px; background: #fff; border-bottom: 1px solid #ddd; }
    #editor-root { padding: 8px; }
    .ace-prompt-placeholder { border-bottom: 2px dotted #1976d2; position: absolute; }
    .ace-loc-clause { border-bottom: 2px dotted #2e7d32; position: absolute; }
    .ace-review-comment { border-bottom: 2px dotted #ef6c00; position: absolute; }
  </style>
</head>
<body>
  <div id="toolbar">
    <span id="status">Continuum editor host (local bundle)</span>
  </div>
  <div id="editor-root"></div>
  <script src="continuum-script-editor.js"></script>
  <script>
    (function () {
      function postToUnity(obj) {
        var json = JSON.stringify(obj);
        if (window.unityBridge && window.unityBridge.postMessage) {
          window.unityBridge.postMessage(json);
          return;
        }
        if (window.external && window.external.invoke) {
          window.external.invoke(json);
          return;
        }
        console.log('[unity-bridge]', json);
      }

      var requestId = 0;
      var pending = {};

      window.unityBridge = window.unityBridge || {
        callApi: function (method, path, body) {
          return new Promise(function (resolve, reject) {
            var id = 'req-' + (++requestId);
            pending[id] = { resolve: resolve, reject: reject };
            postToUnity({
              action: 'api',
              requestId: id,
              method: method || 'GET',
              path: path,
              body: typeof body === 'string' ? body : (body ? JSON.stringify(body) : null)
            });
          });
        },
        postMessage: postToUnity,
        deliverResponse: function (json) {
          var resp = typeof json === 'string' ? JSON.parse(json) : json;
          var p = pending[resp.requestId];
          if (!p) return;
          delete pending[resp.requestId];
          if (resp.ok) {
            try { p.resolve(resp.data ? JSON.parse(resp.data) : null); }
            catch (_) { p.resolve(resp.data); }
          } else {
            p.reject(new Error(resp.error || 'api failed'));
          }
        }
      };

      window.continuumHost = {
        _inst: null,
        mount: function (options) {
          options = options || {};
          var root = document.getElementById('editor-root');
          root.innerHTML = '';
          window.continuumHost._inst = ContinuumScriptEditor.mountWithBridge(root, window.unityBridge, options);
          return window.continuumHost._inst;
        },
        getValue: function () { return ContinuumScriptEditor.getValue(window.continuumHost._inst); },
        getSelection: function () { return ContinuumScriptEditor.getSelection(window.continuumHost._inst); },
        renderOverlays: function (opts) { return ContinuumScriptEditor.renderOverlays(window.continuumHost._inst, opts); },
        testApplyEdit: async function (draftId, oldText, newText) {
          return window.unityBridge.callApi('POST', '/api/scripts/' + encodeURIComponent(draftId) + '/apply-edit',
            JSON.stringify({ oldText: oldText, newText: newText }));
        }
      };

      document.getElementById('status').textContent = 'Ready — bridge active';
    })();
  </script>
</body>
</html>
