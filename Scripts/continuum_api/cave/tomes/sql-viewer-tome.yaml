id: sql-viewer-tome
name: SQL Viewer Tome
machines:
  schemaMachine:
    events:
      LOAD: sql_viewer_schema
      GET: sql_viewer_schema
      MESSAGE: sql_viewer_schema
  previewMachine:
    events:
      LOAD: sql_viewer_preview
  queryMachine:
    events:
      RUN: sql_viewer_query
      MESSAGE: sql_viewer_query
  validateMachine:
    events:
      VALIDATE: sql_viewer_validate
      MESSAGE: sql_viewer_validate
  recipesMachine:
    events:
      LOAD: sql_viewer_recipes
      GET: sql_viewer_recipes
      MESSAGE: sql_viewer_recipes
robotCopy:
  flows:
    load_schema:
      message: sql_viewer_schema
    run_query:
      message: sql_viewer_query
