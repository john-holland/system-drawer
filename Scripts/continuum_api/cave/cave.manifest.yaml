schema_version: cave-manifest/1
service: continuum
cave_robit:
  middleware:
    - envelope_v2
    - trace_loop_guard
messages:
  # SQL Viewer
  sql_viewer_schema: sql-viewer/schema
  sql_viewer_preview: sql-viewer/preview
  sql_viewer_query: sql-viewer/query
  sql_viewer_validate: sql-viewer/validate
  sql_viewer_recipes: sql-viewer/recipes
  # Stories / work orders
  list_stories: stories/list
  create_story: stories/create
  get_story: stories/get
  patch_story: stories/patch
  story_assignees_add: stories/assignees/add
  story_assignees_remove: stories/assignees/remove
  story_watchers_add: stories/watchers/add
  story_watchers_remove: stories/watchers/remove
  story_validate_causality: stories/validate-causality
  story_clone: stories/clone
  story_reopen: stories/reopen
  list_work_orders: work-orders/list
  create_work_order: work-orders/create
  run_work_order_causality: work-orders/run-causality
  # Legal
  list_legal_cases: legal/cases/list
  create_legal_case: legal/cases/create
  get_legal_case: legal/cases/get
  patch_legal_case: legal/cases/patch
  legal_case_resolution: legal/cases/resolution
  legal_preordering_gate: legal/platform-features/preordering
  legal_feature_gates: legal/feature-gates/list
  legal_case_code_lines: legal/cases/code-lines
  narrative_overlay_get: narrative/overlay/get
  narrative_overlay_save: narrative/overlay/save
  calendar_subscriptions_list: calendar/subscriptions/list
  calendar_subscriptions_create: calendar/subscriptions/create
  calendar_sync_now: calendar/sync-now
  # Table read
  table_read_session_open: table-read/session/open
  table_read_session_end: table-read/session/end
  table_read_chat_ensure: table-read/chat/ensure
  table_read_invite: table-read/invite
  table_read_messages_list: table-read/messages/list
  table_read_messages_send: table-read/messages/send
  # Lemma
  lemma_browse: thesaurus/entries/search
  # Dialogue
  dialogue_compile: dialogue/compile
  dialogue_session_open: dialogue/session/open
  dialogue_choose: dialogue/choose
  dialogue_advance: dialogue/advance
  dialogue_sync_goals: dialogue/goals/sync
  dialogue_suggest_generate: dialogue/suggest/generate
  dialogue_suggest_accept: dialogue/suggest/accept
  dialogue_speech_synthesize: dialogue/speech/synthesize
  dialogue_speech_inpaint: dialogue/speech/inpaint
  # Quest
  quest_compile: quest/compile
  quest_session_open: quest/session/open
  quest_objective_activate: quest/objective/activate
  quest_objective_complete: quest/objective/complete
  quest_sync_goals: quest/goals/sync
  quest_map_refresh: quest/map/refresh
  quest_spatial_nodes: quest/spatial-nodes
  quest_summary_style_suggest: quest/summary/style-suggest
  quest_summary_generate: quest/summary/generate
  quest_summary_accept: quest/summary/accept
  quest_art_generate: quest/art/generate
  quest_art_inpaint: quest/art/inpaint
  # Dream cycle
  dream_day_complete: dream-cycle/day/complete
  dream_night_complete: dream-cycle/night/complete
  dream_memory_recall: dream-cycle/memory/recall
  dream_sleep_wave_get: dream-cycle/sleep-wave/get
  # Production (federated resaurce)
  production_budget_list: production/budget/list
  production_budget_create: production/budget/create
  production_budget_get: production/budget/get
  production_budget_journal_list: production/budget/journal/list
  production_budget_journal_post: production/budget/journal/post
  production_budget_water_level: production/budget/water-level
  production_budget_allocate_story: production/budget/allocate-story
  production_budget_publish_sheets: production/budget/publish-sheets
  production_schedule_list: production/schedule/list
  production_schedule_create: production/schedule/create
  production_schedule_get: production/schedule/get
  production_schedule_milestone_stories: production/schedule/milestone/stories
  # Chat (federated)
  chat_messages_list: chat/messages/list
  chat_messages_send: chat/messages/send
mutating_routes:
  - stories/create
  - stories/patch
  - stories/assignees/add
  - stories/assignees/remove
  - stories/watchers/add
  - stories/watchers/remove
  - stories/validate-causality
  - stories/clone
  - stories/reopen
  - work-orders/create
  - work-orders/run-causality
  - legal/cases/create
  - legal/cases/patch
  - legal/cases/resolution
  - legal/platform-features/preordering
  - table-read/session/open
  - table-read/session/end
  - table-read/chat/ensure
  - table-read/invite
  - table-read/messages/send
  - dialogue/session/open
  - dialogue/choose
  - dialogue/advance
  - dialogue/goals/sync
  - dialogue/suggest/generate
  - dialogue/suggest/accept
  - dialogue/speech/synthesize
  - dialogue/speech/inpaint
  - quest/session/open
  - quest/objective/activate
  - quest/objective/complete
  - quest/goals/sync
  - quest/map/refresh
  - quest/summary/generate
  - quest/summary/accept
  - quest/art/generate
  - quest/art/inpaint
  - dream-cycle/day/complete
  - dream-cycle/night/complete
  - dream-cycle/memory/recall
  - sql-viewer/query
structural:
  sql-viewer/**:
    machine: continuum:sqlViewer
  stories/**:
    machine: continuum:storyBoard
  work-orders/**:
    machine: continuum:storyBoard
  legal/**:
    machine: continuum:legalTracker
  table-read/**:
    machine: continuum:tableRead
  thesaurus/**:
    machine: continuum:lemmaLibrary
  dialogue/**:
    machine: continuum:dialogue
  quest/**:
    machine: continuum:quest
handlers:
  sql-viewer/schema:
    internal:
      method: GET
      path: /api/sql-viewer/schema
      headers: [X-User-ID]
  sql-viewer/preview:
    internal:
      method: GET
      path: /api/sql-viewer/tables/{tableName}/preview
      query_from_payload: [limit, offset]
      headers: [X-User-ID]
  sql-viewer/query:
    internal:
      method: POST
      path: /api/sql-viewer/query
      headers: [X-User-ID]
    mutating: true
    lvm_events: [SqlQueryExecuted, TransitionCommitted]
  sql-viewer/validate:
    internal:
      method: POST
      path: /api/sql-viewer/validate
      headers: [X-User-ID]
  sql-viewer/recipes:
    internal:
      method: GET
      path: /api/sql-viewer/recipes
      headers: [X-User-ID]
  stories/list:
    internal:
      method: GET
      path: /api/stories
      query_from_payload: [tenant_id, status, scheduleId, resaurce_schedule_id, project_id]
  stories/create:
    internal:
      method: POST
      path: /api/stories
    mutating: true
    lvm_events: [StoryCreated, TransitionCommitted]
  stories/get:
    internal:
      method: GET
      path: /api/stories/{story_id}
  stories/patch:
    internal:
      method: PATCH
      path: /api/stories/{story_id}
    mutating: true
    lvm_events: [StoryUpdated, TransitionCommitted]
  stories/assignees/add:
    internal:
      method: POST
      path: /api/stories/{story_id}/assignees
    mutating: true
    lvm_events: [StoryAssigneeAdded, TransitionCommitted]
  stories/assignees/remove:
    internal:
      method: DELETE
      path: /api/stories/{story_id}/assignees
    mutating: true
    lvm_events: [StoryAssigneeRemoved, TransitionCommitted]
  stories/watchers/add:
    internal:
      method: POST
      path: /api/stories/{story_id}/watchers
    mutating: true
    lvm_events: [StoryWatcherAdded, TransitionCommitted]
  stories/watchers/remove:
    internal:
      method: DELETE
      path: /api/stories/{story_id}/watchers
    mutating: true
    lvm_events: [StoryWatcherRemoved, TransitionCommitted]
  stories/validate-causality:
    internal:
      method: POST
      path: /api/stories/{story_id}/validate-causality
    mutating: true
    lvm_events: [StoryCausalityValidated, TransitionCommitted]
  stories/clone:
    internal:
      method: POST
      path: /api/stories/{story_id}/clone
    mutating: true
    lvm_events: [StoryCreated, TransitionCommitted]
  stories/reopen:
    internal:
      method: POST
      path: /api/stories/{story_id}/reopen
    mutating: true
    lvm_events: [StoryUpdated, TransitionCommitted]
  work-orders/list:
    internal:
      method: GET
      path: /api/work-orders
      query_from_payload: [story_id]
  work-orders/create:
    internal:
      method: POST
      path: /api/work-orders
    mutating: true
    lvm_events: [WorkOrderCreated, TransitionCommitted]
  work-orders/run-causality:
    internal:
      method: POST
      path: /api/work-orders/{work_order_id}/run-causality-test
    mutating: true
    lvm_events: [WorkOrderCausalityRun, TransitionCommitted]
  legal/cases/list:
    internal:
      method: GET
      path: /api/legal/cases
      query_from_payload: [status]
  legal/cases/create:
    internal:
      method: POST
      path: /api/legal/cases
    mutating: true
    lvm_events: [LegalCaseCreated, TransitionCommitted]
  legal/cases/get:
    internal:
      method: GET
      path: /api/legal/cases/{case_id}
  legal/cases/patch:
    internal:
      method: PATCH
      path: /api/legal/cases/{case_id}
    mutating: true
    lvm_events: [LegalCaseUpdated, TransitionCommitted]
  legal/cases/resolution:
    internal:
      method: POST
      path: /api/legal/cases/{case_id}/resolutions
    mutating: true
    lvm_events: [LegalResolutionAdded, TransitionCommitted]
  legal/platform-features/preordering:
    internal:
      method: GET
      path: /api/legal/platform-features/preordering
  legal/feature-gates/list:
    internal:
      method: GET
      path: /api/legal/feature-gates
  legal/cases/code-lines:
    internal:
      method: GET
      path: /api/legal/cases/{case_id}/code-lines
  narrative/overlay/get:
    internal:
      method: GET
      path: /api/narrative-timeline-overlay
      query_from_payload: [resaurceScheduleId, scheduleId, schedule_id, resaurce_schedule_id, project_id]
  narrative/overlay/save:
    internal:
      method: POST
      path: /api/narrative-timeline-overlay
    mutating: true
    lvm_events: [NarrativeOverlaySaved, TransitionCommitted]
  calendar/subscriptions/list:
    internal:
      method: GET
      path: /api/calendar/subscriptions
  calendar/subscriptions/create:
    internal:
      method: POST
      path: /api/calendar/subscriptions
    mutating: true
    lvm_events: [CalendarSubscriptionCreated, TransitionCommitted]
  calendar/sync-now:
    internal:
      method: POST
      path: /api/calendar/sync-now
    mutating: true
    lvm_events: [CalendarSyncTriggered, TransitionCommitted]
  thesaurus/entries/search:
    internal:
      method: GET
      path: /api/thesaurus/entries
      query_from_payload: [q, limit]
  table-read/session/open:
    handler: table_read.session_open
    mutating: true
    lvm_events: [TableReadSessionOpened, TransitionCommitted]
  table-read/session/end:
    internal:
      method: POST
      path: /api/table-read/sessions/{sessionId}/end
    mutating: true
    lvm_events: [TableReadSessionEnded, TransitionCommitted]
  table-read/chat/ensure:
    internal:
      method: POST
      path: /api/table-read/sessions/{sessionId}/ensure-chat
    mutating: true
    lvm_events: [TableReadChatEnsured, TransitionCommitted]
  table-read/invite:
    internal:
      method: POST
      path: /api/table-read/sessions/{sessionId}/invite
    mutating: true
    lvm_events: [TableReadInviteSent, TransitionCommitted]
  table-read/messages/list:
    internal:
      method: GET
      path: /api/chat/messages
      query_from_payload: [chatRoomId]
      headers: [X-User-ID]
  table-read/messages/send:
    internal:
      method: POST
      path: /api/chat/messages
      headers: [X-User-ID]
    mutating: true
    lvm_events: [TableReadMessageSent, TransitionCommitted]
  production/budget/list:
    proxy: resaurce
  production/budget/create:
    proxy: resaurce
  production/budget/get:
    proxy: resaurce
  production/budget/journal/list:
    proxy: resaurce
  production/budget/journal/post:
    proxy: resaurce
  production/budget/water-level:
    proxy: resaurce
  production/budget/allocate-story:
    proxy: resaurce
  production/budget/publish-sheets:
    internal:
      method: POST
      path: /api/production/budget/{budget_plan_id}/publish-sheets
    mutating: true
    lvm_events: [BudgetSheetsPublished, TransitionCommitted]
  production/schedule/list:
    proxy: resaurce
  production/schedule/create:
    proxy: resaurce
  production/schedule/get:
    proxy: resaurce
  production/schedule/milestone/stories:
    proxy: resaurce
  chat/messages/list:
    proxy: resaurce
  chat/messages/send:
    proxy: resaurce
  dialogue/compile:
    internal:
      method: POST
      path: /api/dialogue/compile
  dialogue/session/open:
    internal:
      method: POST
      path: /api/dialogue/session/open
    mutating: true
    lvm_events: [DialogueSessionOpened, TransitionCommitted]
  dialogue/choose:
    internal:
      method: POST
      path: /api/dialogue/session/{sessionId}/choose
    mutating: true
    lvm_events: [DialogueChoiceMade, TransitionCommitted]
  dialogue/advance:
    internal:
      method: POST
      path: /api/dialogue/session/{sessionId}/advance
    mutating: true
    lvm_events: [DialogueAdvanced, TransitionCommitted]
  dialogue/goals/sync:
    internal:
      method: POST
      path: /api/dialogue/session/{sessionId}/goals/sync
    mutating: true
    lvm_events: [DialogueGoalsSynced, TransitionCommitted]
  dialogue/suggest/generate:
    internal:
      method: POST
      path: /api/dialogue/suggest/generate
    mutating: true
    lvm_events: [DialogueSuggestionGenerated, TransitionCommitted]
  dialogue/suggest/accept:
    internal:
      method: POST
      path: /api/dialogue/suggest/accept
    mutating: true
    lvm_events: [DialogueSuggestionAccepted, TransitionCommitted]
  dialogue/speech/synthesize:
    internal:
      method: POST
      path: /api/dialogue/speech/synthesize
    mutating: true
    lvm_events: [DialogueSpeechGenerated, TransitionCommitted]
  dialogue/speech/inpaint:
    internal:
      method: POST
      path: /api/dialogue/speech/inpaint
    mutating: true
    lvm_events: [DialogueSpeechInpainted, TransitionCommitted]
  quest/compile:
    internal:
      method: POST
      path: /api/quest/compile
  quest/spatial-nodes:
    internal:
      method: GET
      path: /api/quest/spatial-nodes
      query_from_payload: [spatial4dId, spatial_4d_id, mode, narrativeT, narrative_t, project_id]
  quest/session/open:
    internal:
      method: POST
      path: /api/quest/session/open
    mutating: true
    lvm_events: [QuestSessionOpened, TransitionCommitted]
  quest/objective/activate:
    internal:
      method: POST
      path: /api/quest/session/{sessionId}/objective/activate
    mutating: true
    lvm_events: [QuestObjectiveActivated, TransitionCommitted]
  quest/objective/complete:
    internal:
      method: POST
      path: /api/quest/session/{sessionId}/objective/complete
    mutating: true
    lvm_events: [QuestObjectiveCompleted, TransitionCommitted]
  quest/goals/sync:
    internal:
      method: POST
      path: /api/quest/session/{sessionId}/goals/sync
    mutating: true
    lvm_events: [QuestGoalsSynced, TransitionCommitted]
  quest/map/refresh:
    internal:
      method: POST
      path: /api/quest/map/refresh
    mutating: true
    lvm_events: [QuestMapRefreshed, TransitionCommitted]
  quest/summary/style-suggest:
    internal:
      method: POST
      path: /api/quest/summary/style-suggest
  quest/summary/generate:
    internal:
      method: POST
      path: /api/quest/summary/generate
    mutating: true
    lvm_events: [QuestSummaryGenerated, TransitionCommitted]
  quest/summary/accept:
    internal:
      method: POST
      path: /api/quest/summary/accept
    mutating: true
    lvm_events: [QuestSummaryAccepted, TransitionCommitted]
  quest/art/generate:
    internal:
      method: POST
      path: /api/quest/art/generate
    mutating: true
    lvm_events: [QuestArtGenerated, TransitionCommitted]
  quest/art/inpaint:
    internal:
      method: POST
      path: /api/quest/art/inpaint
    mutating: true
    lvm_events: [QuestArtInpainted, TransitionCommitted]
lvm:
  machines:
    - id: continuum:sqlViewer
      prefixes: [sql-viewer/]
      structural_routes:
        - sql-viewer/schema
        - sql-viewer/preview
        - sql-viewer/query
        - sql-viewer/validate
        - sql-viewer/recipes
    - id: continuum:storyBoard
      prefixes: [stories/, work-orders/]
      structural_routes:
        - stories/list
        - stories/create
        - stories/get
        - stories/patch
    - id: continuum:legalTracker
      prefixes: [legal/]
      structural_routes:
        - legal/cases/list
        - legal/cases/get
    - id: continuum:tableRead
      prefixes: [table-read/]
      structural_routes:
        - table-read/session/open
        - table-read/chat/ensure
    - id: continuum:dialogue
      prefixes: [dialogue/]
      structural_routes:
        - dialogue/session/open
        - dialogue/choose
        - dialogue/advance
    - id: continuum:quest
      prefixes: [quest/]
      structural_routes:
        - quest/session/open
        - quest/objective/activate
        - quest/objective/complete
        - quest/spatial-nodes
