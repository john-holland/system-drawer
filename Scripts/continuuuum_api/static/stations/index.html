<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stations — Continuuuum</title>
  <link rel="stylesheet" href="/static/shared/continuuuum-nav/continuuuum-nav.css">
  <link rel="stylesheet" href="/static/shared/cron/cron-humanize.css">
  <link rel="stylesheet" href="/static/stations/stations.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
  <div id="continuuuum-nav-root"></div>
  <main class="stn-main">
    <h1>Stations</h1>
    <p class="stn-lead">Hierarchical placards — cooking, train, bus, computer — under company/gov buildings.</p>
    <label class="stn-row">City id <input id="stn-city" value="demo-city" /></label>
    <nav class="stn-tabs" id="stn-tabs">
      <button type="button" data-tab="treemap" class="active">Treemap</button>
      <button type="button" data-tab="graph">Graph</button>
      <button type="button" data-tab="placards">Placards</button>
      <button type="button" data-tab="commodities">Commodities</button>
      <button type="button" data-tab="assignments">Assignments</button>
    </nav>
    <div id="stn-msg" class="stn-msg" hidden></div>
    <section id="tab-treemap" class="stn-panel active">
      <svg id="stn-treemap" width="100%" height="480"></svg>
    </section>
    <section id="tab-graph" class="stn-panel">
      <svg id="stn-graph" width="100%" height="480"></svg>
    </section>
    <section id="tab-placards" class="stn-panel"></section>
    <section id="tab-commodities" class="stn-panel"></section>
    <section id="tab-assignments" class="stn-panel"></section>
  </main>

  <div class="stn-modal-backdrop" id="stn-modal" role="dialog" aria-modal="true" hidden>
    <div class="stn-modal">
      <h2 id="stn-modal-title">Edit</h2>
      <p class="stn-modal-sub" id="stn-modal-sub"></p>
      <form id="stn-modal-form" class="stn-modal-form"></form>
      <div class="stn-modal-actions">
        <button type="button" id="stn-modal-cancel" class="stn-btn-secondary">Cancel</button>
        <button type="button" id="stn-modal-save">Save</button>
      </div>
    </div>
  </div>

  <script src="/static/shared/continuuuum-user-session/continuuuum-user-session.js"></script>
  <script src="/static/shared/continuuuum-cave-shell/continuuuum-cave-shell.js"></script>
  <script src="/static/shared/continuuuum-cave-shell/continuuuum-tome-bootstrap.js"></script>
  <script src="/static/shared/continuuuum-nav/continuuuum-nav.js"></script>
  <script src="/static/shared/cron/cron-humanize.js"></script>
  <script src="/static/stations/stations.js"></script>
</body>
</html>
