<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Pathing — Continuuuum</title>
  <link rel="stylesheet" href="/static/shared/continuuuum-nav/continuuuum-nav.css">
  <link rel="stylesheet" href="/static/camera-pathing/camera-pathing.css">
</head>
<body>
  <div id="continuuuum-nav-root"></div>
  <main class="cp-main">
    <h1>Camera Pathing</h1>
    <div class="cp-toolbar">
      <label>Episode <input id="cp-episode" placeholder="episode-1"></label>
      <button type="button" id="cp-load">Load scenes</button>
      <label>Scene
        <select id="cp-scene-select">
          <option value="">—</option>
        </select>
      </label>
      <label>Camera / path
        <select id="cp-path-select">
          <option value="">—</option>
        </select>
      </label>
    </div>
    <section id="cp-scenes" class="cp-panel"></section>
    <section id="cp-detail" class="cp-panel"></section>
  </main>
  <script src="/static/shared/continuuuum-user-session/continuuuum-user-session.js"></script>
  <script src="/static/shared/continuuuum-cave-shell/continuuuum-cave-shell.js"></script>
  <script src="/static/shared/continuuuum-cave-shell/continuuuum-tome-bootstrap.js"></script>
  <script src="/static/shared/continuuuum-nav/continuuuum-nav.js"></script>
  <script src="/static/camera-pathing/camera-pathing.js"></script>
</body>
</html>
