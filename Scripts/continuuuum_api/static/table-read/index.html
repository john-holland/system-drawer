<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table Read — Continuuuum</title>
  <link rel="stylesheet" href="/static/shared/continuuuum-nav/continuuuum-nav.css">
  <link rel="stylesheet" href="/static/shared/continuuuum-script-editor/continuuuum-script-editor.css">
  <link rel="stylesheet" href="/static/shared/continuuuum-chat-panel/continuuuum-chat-panel.css">
  <link rel="stylesheet" href="/static/table-read/table-read.css">
  <script src="/static/shared/vendor/ace.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/static/shared/continuuuum-user-session/continuuuum-user-session.js"></script>
  <script src="/static/shared/continuuuum-cave-shell/continuuuum-cave-shell.js"></script>
  <script src="/static/shared/continuuuum-cave-shell/continuuuum-tome-bootstrap.js"></script>
  <script src="/static/shared/continuuuum-nav/continuuuum-nav.js"></script>
  <script src="/static/shared/continuuuum-chat-panel/continuuuum-chat-panel.js"></script>
  <script src="/static/shared/continuuuum-script-editor/continuuuum-script-spans.js"></script>
  <script src="/static/shared/continuuuum-script-editor/continuuuum-script-editor.js"></script>
  <script src="/static/shared/continuuuum-table-read/continuuuum-table-read-recorder.js"></script>
  <script src="/static/shared/continuuuum-table-read/continuuuum-table-read.js"></script>
</head>
<body class="tr-page">
  <div id="continuuuum-nav-root"></div>
  <div class="tr-layout">
    <main class="tr-main">
      <h1>Table Read</h1>
      <div id="tr-status" class="tr-status"></div>

      <section id="tr-session-bar" class="tr-panel tr-session-bar"></section>
      <section id="tr-mode-controls" class="tr-panel tr-mode-controls"></section>
      <section class="tr-panel">
        <h2>Participants</h2>
        <div id="tr-participants"></div>
      </section>
      <section class="tr-panel">
        <div id="tr-turn-controls" class="tr-turn-controls"></div>
      </section>
      <div id="tr-comment-card" class="tr-comment-card" hidden></div>
      <section class="tr-panel">
        <h2>Script</h2>
        <div id="tr-editor-host"></div>
      </section>
      <section id="tr-recording-panel" class="tr-panel"></section>
    </main>
    <aside id="tr-chat-sidebar" class="tr-chat-sidebar">
      <h2 class="tr-chat-title">Session chat</h2>
      <div id="tr-chat-panel"></div>
    </aside>
  </div>
  <script>
    ContinuuuumNav.mount({ app: 'table-read', theme: 'dark' });
    ContinuuuumTomeBootstrap.mountPage({ tomeId: 'table-read-tome' });
    ContinuuuumTableRead.init();
  </script>
</body>
</html>
