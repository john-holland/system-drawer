<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transit Authority Schedules — Continuuuum</title>
  <link rel="stylesheet" href="/static/shared/continuuuum-nav/continuuuum-nav.css">
  <link rel="stylesheet" href="/static/transit/transit.css">
</head>
<body>
  <div id="continuuuum-nav-root"></div>
  <main class="ta-main">
    <h1>Transit Authority Schedules</h1>
    <p class="ta-lead">Configure vehicle route cron schedules and building opening / closing / maintenance hours.</p>
    <div id="ta-msg" class="ta-msg" hidden></div>

    <section class="ta-panel">
      <h2>Vehicle schedule</h2>
      <form id="ta-vehicle-form" class="ta-form">
        <label>Vehicle id <input name="vehicleId" required placeholder="bus-12" /></label>
        <label>Route id <input name="routeId" required placeholder="route-downtown" /></label>
        <label>Cron <input name="cronExpr" value="* 6-22 * * 1-5" /></label>
        <label>Kind
          <select name="scheduleKind">
            <option value="service">service</option>
            <option value="maintenance">maintenance</option>
          </select>
        </label>
        <label>Label <input name="label" placeholder="Downtown loop" /></label>
        <button type="submit">Add vehicle schedule</button>
      </form>
      <ul id="ta-vehicle-list" class="ta-list"></ul>
    </section>

    <section class="ta-panel">
      <h2>Building schedule</h2>
      <form id="ta-building-form" class="ta-form">
        <label>Station id <input name="stationId" required placeholder="bus-depot-1" /></label>
        <label>Building id <input name="buildingId" placeholder="optional" /></label>
        <label>Cron <input name="cronExpr" value="* 5-23 * * *" /></label>
        <label>Kind
          <select name="kind">
            <option value="opening">opening</option>
            <option value="closing">closing</option>
            <option value="maintenance">maintenance</option>
          </select>
        </label>
        <button type="submit">Add building schedule</button>
      </form>
      <ul id="ta-building-list" class="ta-list"></ul>
    </section>

    <section class="ta-panel">
      <h2>Vehicle → routes map</h2>
      <button type="button" id="ta-refresh-map">Refresh map</button>
      <pre id="ta-routes-map" class="ta-pre"></pre>
    </section>
  </main>
  <script src="/static/shared/continuuuum-nav/continuuuum-nav.js"></script>
  <script src="/static/transit/transit.js"></script>
</body>
</html>
