<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Legal Tracker — Continuuuum</title>
  <link rel="stylesheet" href="/static/shared/continuuuum-nav/continuuuum-nav.css" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f1419; color: #e6edf3; }
    main { padding: 1rem; max-width: 1100px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { border: 1px solid #30363d; padding: 0.4rem 0.5rem; text-align: left; }
    th { background: #161b22; }
    .sev-critical { color: #f85149; }
    .sev-high { color: #d29922; }
    .gate { background: #21262d; padding: 0.5rem; margin: 0.5rem 0; border-radius: 6px; }
    .errors { color: #f85149; }
    a.case-title-link { color: #58a6ff; text-decoration: none; }
    a.case-title-link:hover { text-decoration: underline; }
    .case-modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 1000;
      display: none; align-items: center; justify-content: center; padding: 1rem;
    }
    .case-modal-overlay.open { display: flex; }
    .case-modal {
      background: #161b22; border: 1px solid #30363d; border-radius: 10px;
      width: min(680px, 96vw); max-height: 90vh; overflow: auto; padding: 1.25rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    .case-modal-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 0.75rem; margin-bottom: 0.75rem;
    }
    .case-modal-header h2 { margin: 0; font-size: 1.15rem; flex: 1; }
    .case-modal-close {
      background: transparent; border: none; color: #8b949e; font-size: 1.4rem;
      line-height: 1; padding: 0 0.25rem; cursor: pointer;
    }
    .case-modal-close:hover { color: #e6edf3; }
    .case-meta { font-size: 0.85rem; color: #8b949e; margin: 0.5rem 0; }
    .case-meta dt { font-weight: 600; color: #c9d1d9; margin-top: 0.5rem; }
    .case-meta dd { margin: 0.15rem 0 0; }
    .resolution { background: #21262d; padding: 0.5rem; margin: 0.35rem 0; border-radius: 6px; font-size: 0.85rem; }
    .code-ref { font-family: ui-monospace, monospace; font-size: 0.78rem; color: #8b949e; }
    .case-edit, .case-review { margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid #30363d; }
    .case-edit label, .case-review label { display: block; margin: 0.35rem 0; font-size: 0.85rem; color: #c9d1d9; }
    .case-edit input, .case-edit select, .case-edit textarea,
    .case-review input, .case-review select, .case-review textarea {
      width: 100%; box-sizing: border-box; background: #21262d; color: #e6edf3;
      border: 1px solid #30363d; border-radius: 4px; padding: 0.35rem 0.5rem; margin-top: 0.15rem;
    }
    .case-edit button, .case-review button {
      margin-top: 0.5rem; background: #238636; color: #fff; border: none; border-radius: 4px;
      padding: 0.4rem 0.75rem; cursor: pointer;
    }
    .hint { font-size: 0.8rem; color: #8b949e; }
  </style>
</head>
<body>
  <header id="continuuuum-nav-root"></header>
  <main>
    <h1>Legal Tracker</h1>
    <p>Open cases and feature gates for agile development — blocks story <code>in_progress</code> on critical collisions.</p>
    <button id="btn-refresh">Refresh</button>
    <h2>Feature gates</h2>
    <div id="gates"></div>
    <h2>Open cases</h2>
    <table>
      <thead><tr><th>Title</th><th>Status</th><th>Severity</th><th>Category</th><th>Product</th></tr></thead>
      <tbody id="cases"></tbody>
    </table>
  </main>

  <div id="case-modal-overlay" class="case-modal-overlay" aria-hidden="true">
    <div class="case-modal" role="dialog" aria-modal="true" aria-labelledby="case-modal-title">
      <div class="case-modal-header">
        <h2 id="case-modal-title">Legal case</h2>
        <button type="button" class="case-modal-close" id="case-modal-close" aria-label="Close">&times;</button>
      </div>
      <div id="case-modal-body"></div>
    </div>
  </div>

  <script src="/static/shared/continuuuum-user-session/continuuuum-user-session.js"></script>
  <script src="/static/shared/continuuuum-cave-shell/continuuuum-cave-shell.js"></script>
  <script src="/static/shared/continuuuum-nav/continuuuum-nav.js"></script>
  <script src="/legal-tracker/legal-tracker.js"></script>
</body>
</html>
