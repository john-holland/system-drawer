<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Wires — Continuuuum</title>
  <link rel="stylesheet" href="/static/shared/continuuuum-nav/continuuuum-nav.css">
  <link rel="stylesheet" href="/static/phone-wires/phone-wires.css">
</head>
<body>
  <div id="continuuuum-nav-root"></div>
  <main class="pw-main">
    <h1>Phone Wires</h1>
    <p class="pw-lead">Shared pole ↔ wire ↔ intersection associations for Road Lanes designers.</p>
    <div id="pw-msg" class="pw-msg" hidden></div>
    <section class="pw-panel">
      <h2>Filters</h2>
      <label>Pole id <input id="pw-pole" /></label>
      <label>Wire id <input id="pw-wire" /></label>
      <label>Intersection lot <input id="pw-lot" /></label>
      <button type="button" id="pw-refresh">Refresh</button>
      <button type="button" id="pw-auto">Auto-fill from poles</button>
    </section>
    <section class="pw-panel">
      <h2>Save association</h2>
      <form id="pw-form">
        <label>Pole id <input name="pole_id" required /></label>
        <label>Wire id <input name="wire_id" required /></label>
        <label>Intersection lot <input name="intersection_lot_id" /></label>
        <label>Kind
          <select name="wire_end_kind">
            <option>TrafficSignal</option>
            <option>StreetLight</option>
            <option>Sign</option>
            <option>ElectricalMount</option>
            <option>StuckBranch</option>
            <option>HangingShoes</option>
          </select>
        </label>
        <label>t01 <input name="t01" type="number" step="0.05" value="0.5" /></label>
        <button type="submit">Save</button>
      </form>
    </section>
    <section class="pw-panel">
      <h2>Associations</h2>
      <table id="pw-table">
        <thead>
          <tr><th>Pole</th><th>Wire</th><th>Lot</th><th>Kind</th><th>t</th><th>Updated</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
    <p><a href="/city-config">City config</a></p>
  </main>
  <script src="/static/shared/continuuuum-nav/continuuuum-nav.js"></script>
  <script src="/static/phone-wires/phone-wires.js"></script>
</body>
</html>
