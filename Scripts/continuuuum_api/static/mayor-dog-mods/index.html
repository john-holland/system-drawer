<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mayor Dog Mods</title>
  <link rel="stylesheet" href="/static/shared/continuuuum-nav/continuuuum-nav.css" />
  <link rel="stylesheet" href="/mayor-dog-mods/mod-portal.css" />
</head>
<body>
  <div id="continuuuum-nav-root"></div>
  <header class="md-header">
    <h1>Mayor Dog Mods</h1>
    <nav>
      <a href="#browse" data-view="browse">Browse</a>
      <a href="#upload" data-view="upload">Upload</a>
      <a href="#settings" data-view="settings">Upload Settings</a>
    </nav>
    <label>Signed in as <strong id="user-label">—</strong></label>
    <label>Episode ID <input id="episode-id" type="text" placeholder="draft episode id (optional)" /></label>
  </header>
  <main id="app"></main>
  <div id="md-modal" class="md-modal" hidden>
    <div class="md-modal-panel" role="dialog" aria-modal="true" aria-labelledby="md-modal-title">
      <h2 id="md-modal-title">Edit mod</h2>
      <div id="md-modal-body"></div>
      <div class="md-modal-actions">
        <button type="button" id="md-modal-cancel">Cancel</button>
        <button type="button" id="md-modal-save">Save</button>
      </div>
    </div>
  </div>
  <script src="/static/shared/continuuuum-user-session/continuuuum-user-session.js"></script>
  <script src="/static/shared/continuuuum-nav/continuuuum-nav.js"></script>
  <script src="/mayor-dog-mods/mod-portal-skin.js"></script>
  <script src="/mayor-dog-mods/mod-upload-settings.js"></script>
  <script src="/mayor-dog-mods/mod-portal.js"></script>
  <script>
    if (window.ContinuuuumNav && typeof ContinuuuumNav.mount === 'function') {
      ContinuuuumNav.mount({ app: 'mayor-dog-mods', theme: 'light' });
    }
  </script>
</body>
</html>
