# Continuuuum library WebGL host (dance/webcam preview).
# License: export UNITY_LICENSE (ulf contents) before `compose build`.
# Prebuilt serve (no Unity): docker compose --profile prebuilt up webgl-prebuilt
services:
  webgl:
    build:
      context: ../..
      dockerfile: docker/webgl/Dockerfile
      args:
        UNITY_VERSION: "6000.3.2f1"
        UNITY_LICENSE: "${UNITY_LICENSE:-}"
        UNITY_EMAIL: "${UNITY_EMAIL:-}"
        UNITY_PASSWORD: "${UNITY_PASSWORD:-}"
    ports:
      - "8088:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_BASE: "${API_BASE:-http://host.docker.internal:5050}"

  webgl-prebuilt:
    profiles: ["prebuilt"]
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ${CONTINUUUUM_WEBGL_OUT:-../../../continuuuum/library/continuuuum_editor_webgl}:/usr/share/nginx/html/library/continuuuum_editor_webgl:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
