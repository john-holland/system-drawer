# Continuuuum UCC in Docker — sibling repos as API + import path.
#
# Does NOT vendor Modly weights, USC source, or Unity WebGL binaries.
# Bind-mount local checkouts and set HTTP bases for host-gateway APIs.
#
#   docker compose -f docker/ucc/docker-compose.yml up --build
#
# Override host paths:
#   CONTINUUUUM_HOST_REPO, USC_HOST_REPO, MODLY_ROOT, MINECRAFTUUUUM_API

services:
  ucc:
    build:
      context: ../..
      dockerfile: docker/ucc/Dockerfile
    ports:
      - "5050:5050"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CONTINUUUUM_API_BASE: "${CONTINUUUUM_API_BASE:-http://127.0.0.1:5050}"
      USC_API_BASE: "${USC_API_BASE:-http://host.docker.internal:5050}"
      MODLY_ROOT: /opt/modly
      MINECRAFTUUUUM_API: "${MINECRAFTUUUUM_API:-}"
      CONTINUUUUM_REPO: /opt/continuuuum
      CONTINUUUUM_LIBRARY_UPLOADS: /data/library_uploads
      CONTINUUUUM_DB: /data/continuuuum.db
      PYTHONPATH: /app/Scripts:/opt/usc
    volumes:
      - ../../Scripts:/app/Scripts:ro
      - ${CONTINUUUUM_HOST_REPO:-../../../continuuuum}:/opt/continuuuum:ro
      - ${USC_HOST_REPO:-../../../unified-semantic-compressor}:/opt/usc:ro
      - ${MODLY_ROOT:-../../../../Development/modly}:/opt/modly:ro
      - ucc-data:/data

volumes:
  ucc-data:
